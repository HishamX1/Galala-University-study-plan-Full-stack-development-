name: Architecture Review 1 integration tests

on:
  push:
    branches:
      - architecture-review-1-unverified
      - codex/catalog-import-staging
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gu_pt_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gu_pt_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PG_SSL: "false"
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gu_pt_phase1_test
      ALLOW_DESTRUCTIVE_TEST_DB: I_CONFIRM_DISPOSABLE_LOCAL_DATABASE
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gu_pt_phase1_test

    steps:
      - name: Check out review branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Apply canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Seed canonical catalog fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Rehearse disposable PostgreSQL dump and restore
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to run outside this workflow's explicitly disposable service DB.
          [[ "${GITHUB_ACTIONS:-}" == "true" ]]
          [[ "${DATABASE_URL:-}" == "postgresql://postgres:postgres@127.0.0.1:5432/gu_pt_phase1_test" ]]
          [[ "${TEST_DATABASE_URL:-}" == "$DATABASE_URL" ]]
          [[ "${ALLOW_DESTRUCTIVE_TEST_DB:-}" == "I_CONFIRM_DISPOSABLE_LOCAL_DATABASE" ]]

          container_id="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          dump_file="$RUNNER_TEMP/gu-pt-recovery-drill.dump"
          restore_db="gu_pt_recovery_drill_test"

          if docker exec "$container_id" psql -U postgres -d postgres -Atqc \
            "SELECT 1 FROM pg_database WHERE datname = '$restore_db'" | grep -qx 1; then
            echo "Refusing to overwrite an existing recovery-drill database."
            exit 1
          fi

          cleanup() {
            docker exec "$container_id" dropdb --if-exists -U postgres "$restore_db" >/dev/null 2>&1 || true
            rm -f "$dump_file"
          }
          trap cleanup EXIT

          docker exec "$container_id" pg_dump -U postgres -d gu_pt_phase1_test --format=custom > "$dump_file"
          docker exec "$container_id" createdb -U postgres "$restore_db"
          docker exec -i "$container_id" pg_restore -U postgres -d "$restore_db" --no-owner --no-privileges < "$dump_file"

          source_counts="$(docker exec "$container_id" psql -U postgres -d gu_pt_phase1_test -Atqc \
            "SELECT 'faculties=' || count(*) FROM public.faculties
             UNION ALL SELECT 'programs=' || count(*) FROM public.programs
             UNION ALL SELECT 'courses=' || count(*) FROM public.courses
             UNION ALL SELECT 'program_courses=' || count(*) FROM public.program_courses
             UNION ALL SELECT 'course_prerequisites=' || count(*) FROM public.course_prerequisites
             ORDER BY 1")"
          restored_counts="$(docker exec "$container_id" psql -U postgres -d "$restore_db" -Atqc \
            "SELECT 'faculties=' || count(*) FROM public.faculties
             UNION ALL SELECT 'programs=' || count(*) FROM public.programs
             UNION ALL SELECT 'courses=' || count(*) FROM public.courses
             UNION ALL SELECT 'program_courses=' || count(*) FROM public.program_courses
             UNION ALL SELECT 'course_prerequisites=' || count(*) FROM public.course_prerequisites
             ORDER BY 1")"

          if [[ "$source_counts" != "$restored_counts" ]]; then
            echo "Restored migration/catalog counts differ from the source database."
            exit 1
          fi
          echo "Disposable PostgreSQL dump/restore preserved migration and catalog row counts."

      - name: Run static and database-free regressions
        run: >-
          npm run check &&
          npm run check:password-reset-email &&
          npm run test:password-reset-email-provider &&
          npm run test:password-recovery-navigation &&
          npm run check:catalog-concurrency &&
          npm run test:catalog-concurrency &&
          npm run check:migration-preflight &&
          npm run test:migration-preflight &&
          npm run check:import-staging &&
          npm run check:admin-transactions &&
          npm run check:catalog-crud &&
          npm run test:db-guard &&
          npm run test:refresh-rollback &&
          npm run test:admin-routes &&
          npm run check:complaint-visibility &&
          npm run check:notification-read &&
          npm run test:notification-read-contract &&
          npm run test:complaint-visibility-contract &&
          npm run test:admin-import-staging-routes &&
          npm run test:admin-ops-repositories &&
          npm run test:admin-import &&
          npm run test:student-catalog-xss &&
          npm run test:signup-rate-limit &&
          npm run test:security-headers &&
          npm run test:api-config &&
          npm run test:doctor-contract &&
          npm run test:session-restoration &&
          npm run test:catalog-cache-contract &&
          npm run test:student-navigation-contract &&
          npm run test:error-disclosure &&
          npm run test:foundation &&
          npm run test:dashboard &&
          npm run check:support-pagination &&
          npm run test:support-pagination &&
          npm run check:dashboard-db-performance &&
          npm run check:dashboard-quick-access &&
          npm run test:dashboard-quick-access &&
          npm run check:admin-ui-contract &&
          npm run test:admin-ui-contract

      - name: Run PostgreSQL-backed integration regressions
        run: >-
          npm run test:auth &&
          npm run test:session &&
          npm run test:student-portal &&
          npm run test:catalog-cache &&
          npm run test:recycle-bin &&
          npm run test:admin-transactions &&
          npm run test:admin-import-staging &&
          npm run test:catalog-crud &&
          npm run test:complaint-visibility &&
          npm run test:notification-read &&
          npm run test:password-reset-email &&
          npm run test:dashboard-db-performance
