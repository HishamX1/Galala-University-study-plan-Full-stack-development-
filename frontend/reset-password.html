<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set a new password | Galala University</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="index.html"><img src="images/GU-Logo-Color-Original.png" alt=""><strong>Study Plan Center</strong></a>
    <section class="card">
      <h1>Set a new password</h1>
      <p class="hint">Use a password of at least 12 characters with three character types.</p>
      <p id="reset-error" class="error" role="alert" aria-live="polite"></p>
      <p id="reset-success" class="status" role="status" aria-live="polite" hidden></p>
      <form id="reset-form">
        <label>New password<input name="password" type="password" required autocomplete="new-password"></label>
        <label>Confirm password<input name="confirmPassword" type="password" required autocomplete="new-password"></label>
        <button>Update password</button>
      </form>
      <nav class="links" aria-label="Recovery navigation">
        <a id="reset-request-link" href="password-reset-request.html">Request a new reset link</a>
        <a href="student-login.html">Return to student login</a>
        <a href="admin-login.html">Administrator login</a>
        <a href="index.html">Back to home</a>
      </nav>
    </section>
  </main>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
