<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Signup | Galala University</title><link rel="stylesheet" href="auth.css"></head><body><main class="auth-shell"><a class="brand" href="index.html"><img src="images/GU-Logo-Color-Original.png" alt="Galala University"><strong>Study Plan Center</strong></a><section class="card"><h1>Create student account</h1><p class="hint">Use a password of at least 12 characters with three character types.</p><form data-auth-mode="signup"><label>Full name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Student ID <span class="hint">(optional)</span><input name="studentId"></label><div class="two"><label>Password<input name="password" type="password" required autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" required autocomplete="new-password"></label></div><label class="hint"><input id="toggle-passwords" type="checkbox"> Show passwords while typing</label><p class="error" id="auth-error" role="alert"></p><button>Create account</button></form><div class="links"><a href="student-login.html">Already have an account?</a></div></section></main><script type="module" src="auth.js"></script></body></html>
