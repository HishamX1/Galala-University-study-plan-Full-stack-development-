<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Login | Galala University</title>
  <link rel="stylesheet" href="auth.css">
  <style>#auth-status:not([hidden]){padding:10px 12px;border-radius:8px;background:#edf7ed;color:#1d5e2a;font-weight:600}</style>
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="index.html"><img src="images/GU-Logo-Color-Original.png" alt="Galala University"><strong>Study Plan Center</strong></a>
    <section class="card">
      <h1>Student Login</h1>
      <p>Sign in to access your student study-plan portal.</p>
      <p class="status" id="auth-status" role="status" aria-live="polite" hidden></p>
      <form data-auth-mode="student">
        <label>Email or Student ID<input name="identifier" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <p class="error" id="auth-error" role="alert"></p>
        <button>Sign in to Student Portal</button>
      </form>
      <nav class="links" aria-label="Login navigation">
        <a href="student-signup.html">Create a student account</a>
        <a href="student-password-reset-request.html">Forgot password?</a>
        <a href="admin-login.html">Administrator login</a>
        <a href="index.html">Back to home</a>
      </nav>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
