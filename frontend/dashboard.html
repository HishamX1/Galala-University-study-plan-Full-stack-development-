<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | GU Study Plan Center</title><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="dashboard.css"></head>
<body><a class="skip-link" href="#dashboard-main">Skip to dashboard content</a>
<header class="dashboard-topbar"><a href="./index.html" class="dashboard-brand"><img src="images/GU-Logo.svg" alt="Galala University"><span>Study Plan Center</span></a><div class="topbar-actions"><button id="notification-button" class="icon-button" aria-label="Open notifications" aria-expanded="false">Notifications <span id="notification-count" class="badge" hidden>0</span></button><button id="sign-out" class="signout-button" type="button">Sign Out</button></div></header>
<main id="dashboard-main" class="dashboard-shell"><section id="identity-header" class="identity-header" aria-live="polite"></section><section id="dashboard-content" class="dashboard-grid" aria-live="polite"><p class="loading">Restoring your authenticated dashboard…</p></section></main>
<dialog id="profile-dialog" class="profile-dialog"><form id="profile-form"><div class="dialog-heading"><h2>Profile settings</h2><button class="icon-button" type="button" id="close-profile" aria-label="Close profile settings">Close</button></div><label>Full name<input name="name" required maxlength="120"></label><label>Username<input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]+" aria-describedby="username-help"></label><small id="username-help">3–20 characters: letters, numbers, dots, or underscores.</small><fieldset><legend>Choose an avatar</legend><div id="avatar-options" class="avatar-options"></div></fieldset><label>Upload custom avatar (JPG, PNG, or WebP; max 700 KB)<input id="avatar-upload" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="dialog-actions"><button id="remove-avatar" type="button" class="button secondary">Remove custom avatar</button><button type="button" id="cancel-profile" class="button secondary">Cancel</button><button class="button primary" type="submit">Save profile</button></div><p id="profile-error" role="alert"></p></form></dialog>
<script src="config.js"></script><script type="module" src="dashboard.js"></script></body></html>
