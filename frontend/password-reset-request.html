<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request password reset | Galala University</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="index.html"><img src="images/GU-Logo-Color-Original.png" alt=""><strong>Study Plan Center</strong></a>
    <section class="card">
      <h1>Request password reset</h1>
      <p>Enter your registered email or student ID. We do not recover or reveal old passwords.</p>
      <form id="request-form">
        <label>Email or Student ID<input name="identifier" required autocomplete="username"></label>
        <label>Optional note<textarea name="message"></textarea></label>
        <p class="error" id="request-message" role="status" aria-live="polite"></p>
        <button>Request reset</button>
      </form>
      <nav class="links" aria-label="Recovery navigation">
        <a href="student-login.html">Return to student login</a>
        <a href="admin-login.html">Administrator login</a>
        <a href="index.html">Back to home</a>
      </nav>
    </section>
  </main>
  <script type="module" src="password-reset-request.js"></script>
</body>
</html>
