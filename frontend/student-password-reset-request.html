<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset student password | Galala University</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <a class="brand" href="index.html"><img src="images/GU-Logo-Color-Original.png" alt=""><strong>Study Plan Center</strong></a>
    <section class="card">
      <h1>Reset student password</h1>
      <p>Enter the email address registered to your student account. If an active student account matches, a one-time link will be sent to that address.</p>
      <form id="student-reset-request-form">
        <label>Registered student email<input name="email" type="email" maxlength="254" required autocomplete="email"></label>
        <p class="status" id="student-reset-request-message" role="status" aria-live="polite"></p>
        <button type="submit">Send reset link</button>
      </form>
      <nav class="links" aria-label="Password recovery navigation">
        <a href="student-login.html">Return to student login</a>
        <a href="index.html">Back to home</a>
      </nav>
    </section>
  </main>
  <script type="module" src="student-password-reset-request.js"></script>
</body>
</html>
